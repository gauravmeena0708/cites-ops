[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cites-ops"
version = "1.0.0"
description = "Enterprise Operations Intelligence & Issue Triage Framework for Multi-Channel Support and Tracker Analysis"
readme = "README.md"
authors = [{ name = "CITES Operations Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
cites-ops = "cites_ops.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cites_ops*"]
