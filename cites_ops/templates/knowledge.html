<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CITES knowledge candidates</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#17354d;font:15px/1.6 'Segoe UI',Arial,sans-serif}header{background:#17354d;color:white;padding:25px}main{max-width:1050px;padding:24px;margin:auto}h1{margin:0}article{background:white;border:1px solid #d8e2ea;border-radius:9px;padding:20px;margin:18px 0}input,select,button{font:inherit;padding:9px;border:1px solid #b8cbd5;border-radius:5px}input{max-width:100%;width:380px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}.muted{font-size:13px;color:#536879}.notice{background:#fff7e7;border-left:4px solid #c88a21;padding:12px}.controls{display:flex;gap:10px;flex-wrap:wrap}h2{font-size:18px}summary{cursor:pointer}button{cursor:pointer}a{color:#087396}</style></head><body><header><h1>CITES knowledge candidates</h1><p>New functionality · Reported fixes · Workarounds</p></header><main><p id="range"></p><p class="notice">Entries are extracted announcements requiring review. A reported fix is not proof of deployment or successful resolution for every office. Configured identifiers and email addresses are masked; review before sharing.</p><div class="controls"><input id="search" type="search" placeholder="Search functionality or announcement" aria-label="Search knowledge"><select id="kind" aria-label="Entry type"><option value="">All entry types</option><option>New functionality</option><option>Reported fix</option><option>Workaround</option></select></div><p id="count"></p><div id="entries"></div><button id="more">Show more</button></main><script type="application/json" id="data">__PAYLOAD__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let limit=30;const el=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;};$('range').textContent='Updated '+D.date+' · retained announcements through this date.';function render(){const query=$('search').value.toLowerCase();const rows=D.entries.filter(e=>(!$('kind').value||e.type===$('kind').value)&&[e.text,...e.functionalities].some(v=>v.toLowerCase().includes(query)));$('count').textContent=rows.length+' candidates';$('entries').replaceChildren();for(const e of rows.slice(0,limit)){const a=document.createElement('article');a.append(el('p',e.date+' · '+e.type+' · '+e.state,'muted'),el('h2',e.functionalities.join(', ')),el('pre',e.text));if(e.tickets.length)a.append(el('p','Linked tickets: '+e.tickets.join(', ')));const d=document.createElement('details');d.append(el('summary','Supporting messages'));for(const s of e.evidence)d.append(el('p',s.source+' · message '+s.message+' · '+s.date,'muted'),el('pre',s.text));a.append(d);$('entries').append(a);}$('more').hidden=rows.length<=limit;}$('search').oninput=$('kind').onchange=()=>{limit=30;render();};$('more').onclick=()=>{limit+=30;render();};render();
</script></body></html>
